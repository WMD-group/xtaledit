[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "xtaledit"
version = "0.1.0"
description = "Evaluates inorganic crystal structures generated from AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymatgen>=2024.0",
    "pandas>=2.0",
    "mace-torch",
    "torch",
    "ase",
    "mp-api",
    "python-dotenv",
    "smact",
    "tqdm>=4.0",
]

[dependency-groups]
dev = [
    "isort>=5.13",
    "matplotlib>=3.8",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "seaborn>=0.13.0",
    "tabulate>=0.10.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "pymatviz>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
