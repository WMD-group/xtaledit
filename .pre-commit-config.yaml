repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-id]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff          # linter + auto-fix (equivalent to: ruff check --fix)
        args: [--fix]
      - id: ruff-format   # formatter (equivalent to: ruff format)
